spring.application.name=athletecore-api

# =======================================
# DATASOURCE CONFIGURATION
# =======================================
# URL de conexión a PostgreSQL usando variable de entorno con fallback para desarrollo
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/athletecore}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de conexión pool (HikariCP por defecto en Spring Boot 3.x)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =======================================
# FLYWAY CONFIGURATION
# =======================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=true

# =======================================
# JPA/HIBERNATE CONFIGURATION
# =======================================
# validate: Validar que el esquema coincide con las entidades (no modificar en prod)
# Nunca usar create o create-drop en producción
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =======================================
# LOGGING CONFIGURATION
# =======================================
logging.level.root=INFO
logging.level.com.athletecore=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# =======================================
# SERVER CONFIGURATION
# =======================================
server.port=${SERVER_PORT:8080}

# =======================================
# EXCEPTION HANDLING CONFIGURATION
# =======================================
# Lanar excepciones cuando no se encuentra un handler para manejar errores de 404
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# =======================================
# CORS CONFIGURATION
# =======================================
# CORS deshabilitado por defecto (producción): sin orígenes configurados,
# el navegador bloquea llamadas cross-origin a esta API privada.
# En desarrollo (perfil local) se habilita para el dev server del frontend;
# para otro ambiente, configurar la variable CORS_ORIGINS (orígenes separados por coma).
spring.web.cors.allowed-origins=${CORS_ORIGINS:}

# =======================================
# SECURITY CONFIGURATION
# =======================================
# JWT secret (debe configurarse en entorno)
# JWT secret - MUST be set via environment variable in production
spring.security.jwt.secret=${JWT_SECRET}
# Token expiration time in milliseconds (24 horas)
spring.security.jwt.expiration=${JWT_EXPIRATION:86400000}

# =======================================
# TRAINING MODULE CONFIGURATION
# =======================================
# Umbral de ausencias consecutivas que dispara una alerta por deportista (default 3)
training.attendance.absence-threshold=${TRAINING_ABSENCE_THRESHOLD:3}

# =======================================
# CHECKUP MODULE CONFIGURATION
# =======================================
# Umbral de proximidad al podio (segundos) para clasificar "Cercano a medallería"
# en la proyección de medallería (default 1.500, override por env var)
checkup.medal-proximity-threshold-seconds=${CHECKUP_MEDAL_PROXIMITY_THRESHOLD_SECONDS:1.500}

# =======================================
# REPORT MODULE CONFIGURATION
# =======================================
# Intervalo de sondeo (ms) del scheduler de reportes programados (default 60000)
report.scheduling.poll-interval-ms=${REPORT_SCHEDULING_POLL_INTERVAL_MS:60000}